# One-click deploy on Render: New > Blueprint > select this repo.
databases:
  - name: htn-db
    plan: free
    databaseName: app
    user: app

services:
  - type: web
    name: htn-login
    runtime: docker
    plan: free
    healthCheckPath: /health
    # Deploys come only from .github/workflows/deploy.yml (label ready_for_deployment on a merged PR).
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: htn-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
